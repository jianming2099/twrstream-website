[[redirects]]
from = "/contact.html"
to = "/request-quote.html"
status = 301
force = true

[[redirects]]
from = "/insights.html"
to = "/blog.html"
status = 301
force = true

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
X-Frame-Options = "SAMEORIGIN"

[[edge_functions]]
function = "customer-service"
path = "/*"
